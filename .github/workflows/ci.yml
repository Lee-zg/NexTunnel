name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Build desktop frontend for embedded assets
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: golangci-lint (desktop)
        working-directory: desktop
        run: $(go env GOPATH)/bin/golangci-lint run --config ../.golangci.yml

      - name: golangci-lint (server)
        working-directory: server
        run: $(go env GOPATH)/bin/golangci-lint run --config ../.golangci.yml

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            server/web/package-lock.json

      - name: Install desktop frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: ESLint desktop frontend
        working-directory: desktop/frontend
        run: npm run lint

      - name: Install server web dependencies
        working-directory: server/web
        run: npm ci

      - name: ESLint server web
        working-directory: server/web
        run: npm run lint

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            server/web/package-lock.json

      - name: Build desktop frontend for embedded assets
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Build Go (server)
        working-directory: server
        run: go list ./... | grep -v '/web/node_modules/' | xargs go build

      - name: Build Go (desktop)
        working-directory: desktop
        run: go list ./... | grep -v '/frontend/node_modules/' | xargs go build

      - name: Build Go (pkg)
        working-directory: pkg
        run: go build ./...

      - name: Vet Go (server)
        working-directory: server
        run: go list ./... | grep -v '/web/node_modules/' | xargs go vet

      - name: Vet Go (desktop)
        working-directory: desktop
        run: go list ./... | grep -v '/frontend/node_modules/' | xargs go vet

      - name: Vet Go (pkg)
        working-directory: pkg
        run: go vet ./...

      - name: Build desktop frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Install server web deps
        working-directory: server/web
        run: npm ci

      - name: Build server web
        working-directory: server/web
        run: npm run build

  verify-scripts-static:
    name: Verify Scripts Static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts, check parameter contracts, and check shell syntax
        shell: pwsh
        run: ./scripts/verify-scripts-static.ps1

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-static
          path: dist/verification/*.json
          if-no-files-found: error
          retention-days: 30

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Build desktop frontend for embedded assets
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Test desktop
        working-directory: desktop
        run: go list ./... | grep -v '/frontend/node_modules/' | xargs go test

      - name: Test server
        working-directory: server
        run: go list ./... | grep -v '/web/node_modules/' | xargs go test

      - name: Test pkg
        working-directory: pkg
        run: go test ./...
